name: Build Tiyin APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../Tiyin.apk
          cd ..
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tiyin.apk --title "Tiyin для Android" --notes "Сборка из ${GITHUB_SHA::7}"
