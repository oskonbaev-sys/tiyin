<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiyin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;
background:#0F3D2E;color:#F2B632;font:600 18px system-ui}</style>
</head>
<body>
<div>Tiyin…</div>
<script>
  var tg = window.Telegram && Telegram.WebApp;
  if (tg) {
    tg.ready();
    // ios | android | android_x | tdesktop | macos | web | weba | unknown
    var p = (tg.platform || "unknown").toLowerCase();
    if (p.indexOf("android") === 0) p = "android";
    tg.sendData(p);   // уходит боту как message.web_app_data и закрывает окно
  }
</script>
</body>
</html>
