<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiyin для Android</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#0F3D2E;color:#fff;font:16px/1.4 system-ui,-apple-system,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  .coin{width:72px;height:72px;border-radius:50%;background:#F2B632;color:#0F3D2E;font:800 40px system-ui;
        display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  a.btn{display:block;width:100%;max-width:340px;margin:10px 0;padding:16px;border-radius:14px;text-decoration:none;
        font-weight:700;font-size:17px;box-sizing:border-box}
  .gold{background:#F2B632;color:#0F3D2E}.ghost{border:2px solid #F2B632;color:#F2B632}
  small{opacity:.7;max-width:340px;margin-top:14px}
</style>
</head>
<body>
  <div class="coin">T</div>
  <h2 style="margin:0 0 8px">Автозапись трат</h2>
  <a class="btn ghost" href="/Tiyin.apk">1. Скачать Tiyin</a>
  <a class="btn gold" id="link" href="#">2. Подключить</a>
  <small>Уже установлено? Сразу жмите «Подключить». Затем включите один переключатель — и всё.</small>
<script>
  var t = new URLSearchParams(location.hash.slice(1)).get("t") || "";
  document.getElementById("link").href =
    "intent://link?t=" + encodeURIComponent(t) +
    "#Intent;scheme=tiyin;package=com.fr8masters.tiyin;end";
</script>
</body>
</html>
